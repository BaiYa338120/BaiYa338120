<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAPID SNAKE</title>
<style>
  /* ============ 页面基础样式 ============ */
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  body {
    /* 深色背景 + 中央微弱辉光，突出游戏画面 */
    background: radial-gradient(ellipse at center, #0d1510 0%, #050806 70%, #000 100%);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #stage { position: relative; touch-action: none; user-select: none; -webkit-touch-callout: none; }
  html, body { overscroll-behavior: none; }
  canvas {
    display: block;
    background: #0a0f0c;
    image-rendering: pixelated;              /* 放大后保持复古像素质感 */
    box-shadow: 0 0 40px rgba(120, 220, 150, .12), 0 0 8px rgba(0, 0, 0, .9);
    touch-action: none;                      /* 画板拖拽绘制时禁止浏览器手势 */
  }
  /* ============ 移动端暂停按钮（仅触屏设备对局中显示） ============ */
  #pauseBtn {
    position: absolute;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 42px;
    height: 42px;
    border-radius: 9px;
    background: rgba(0, 0, 0, .32);
    color: #fff;
    font: bold 20px sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 3;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  #pauseBtn.hidden { display: none; }
  /* ============ 复古扫描线遮罩（CRT 风格，覆盖在画面上但不拦截点击） ============ */
  #scan {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 2;
    background:
      repeating-linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0) 0px,
        rgba(0, 0, 0, 0) 2px,
        rgba(0, 0, 0, .18) 3px,
        rgba(0, 0, 0, 0) 4px
      );
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="scan"></div>
  <div id="pauseBtn" class="hidden">❚❚</div>
</div>

<script>
"use strict";
/* ================================================================
 * 一、常量与全局配置
 * ================================================================ */
const W = 400, H = 700;           // 游戏逻辑尺寸（固定 400×700）
const CELL = 20;                  // 一格 = 20 像素（整屏 20 列 × 35 行）
const GRID_W = W / CELL;          // 列数 20
const GRID_H = H / CELL;          // 行数 35
const SEG_R = 9;                  // 蛇节方块与尖刺碰撞用的近似圆半径

const PLAT_W = 6;                 // 平台宽度（格数）
const PLAT_H = 1;                 // 平台高度（格数）
const GAP_CHOICES = [4, 8, 12];   // 上下平台之间的"空隙"格数候选（从其中随机，不含平台本身）

const SCROLL_BASE = 40;            // 镜头初始滚动速度 px/s（2 格/秒）
const SCROLL_ACCEL = 2.0;          // 滚动加速：每 1 秒 +0.1 格/秒（= 2 px/s²，难度递增）
const SCROLL_MAX = 160;            // 滚动速度上限 px/s（8 格/秒）
const SPIKE_BASE = 0.05;          // 平台每格初始生成尖刺的概率（5%）
const SPIKE_ACCEL = 0.0035;       // 尖刺概率每秒增量（难度递增）
const SPIKE_MAX = 0.20;           // 每格带刺概率上限（20%）
const SPIKE_H = 14, SPIKE_HW = 8; // 尖刺高度 与 底边半宽
const FALL_START = 0.30;          // 悬空下落的初始间隔（秒），间隔越短越快
const TAP_INTERVAL = 1 / 6;       // 点按限速：连点最多每 1/6 秒移动一格
const HOLD_INTERVAL = 1 / 4;       // 长按限速：按住持续移动每 1/4 秒一格
const BEST_KEY = 'rapid_snake_best';     // localStorage 中保存最高分的键名
const BEST_KEY_LEGACY = 'abyss_snake_best'; // 旧版键名（启动时自动迁移到新键）

/* ============ 画布与自适应缩放 ============ */
const canvas = document.getElementById('cv');
const ctx = canvas.getContext('2d');
canvas.width = W;
canvas.height = H;

/* 画布填满视口但保持 400×700 比例（contain 缩放，居中显示） */
function fitCanvas() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width  = (W * s) + 'px';
  canvas.style.height = (H * s) + 'px';
}
window.addEventListener('resize', fitCanvas);
fitCanvas();

/* 触屏设备检测（决定是否显示暂停按钮、启用触控滑动） */
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

/* ============ 游戏状态变量 ============ */
let state = 'ready';              // ready 主菜单 | hats 帽子界面 | playing 游戏中 | settings 设置(暂停) | dead 游戏结束
let platforms = [];               // 平台数组（格坐标，索引 0 是最上方）
let snake = [];                   // 蛇的每一节格坐标 {c, r}，snake[0]=蛇头
let apple = null;                 // 苹果 {c, r, plat}
let scrollAcc = 0;                // 镜头滚动累积量（每满一格镜头下移一格）
let camR = 0;                     // 镜头在世界中的行号（画面顶=世界行 camR；世界固定，镜头向下走）
let fallTimer = 0;                // 悬空下落计时器
let fallInterval = FALL_START;    // 当前下落间隔（越掉越快）
let growPending = 0;              // 待生长的节数（吃到苹果后，蛇头下次移动时不消尾、长一节）
let headDir = 'left';             // 蛇头朝向（用于画眼睛）：left/right/up
let pendingMove = null;           // 按键待执行的移动（点一下走一格，延迟到 update 内执行）
let heldDir = null;               // 当前按住的方向（长按连续移动，null=未按住）
let tapCd = TAP_INTERVAL;         // 点按冷却（初始为满：按下即可立刻走第一格；连点每 1/6 秒一格）
let holdCd = HOLD_INTERVAL;       // 长按冷却（初始为满：长按每 1/4 秒一格）
let squash = 0;                   // 着落压扁程度（0~1，逐步复原）
let trailFx = [];                 // 蛇头残影（拖尾特效，像素坐标）
let score = 0;                    // 总分（浮点）= 生存秒数 + 苹果×5
let gameTime = 0;                 // 本局已进行的秒数（供刺概率/滚动加速计算）
let scrollSpeed = SCROLL_BASE;    // 当前镜头滚动速度（=画面中内容上移的速度）
let best = 0;                     // 历史最高分（浮点）
let deathAt = 0;                  // 死亡时刻（用于防止误触快速重开）
let newRecord = false;            // 本局是否打破纪录
let nowMs = 0;                    // 当前时间戳（毫秒，rAF 提供）

/* 从 localStorage 读取最高分（异常环境下自动回退为 0；旧键名数据自动迁移） */
try { best = parseFloat(localStorage.getItem(BEST_KEY) || '0') || 0; }
catch (e) { best = 0; }
if (!best) {
  try {
    const legacy = parseFloat(localStorage.getItem(BEST_KEY_LEGACY) || '0') || 0;
    if (legacy > 0) { best = legacy; localStorage.setItem(BEST_KEY, String(best)); }
    localStorage.removeItem(BEST_KEY_LEGACY);
  } catch (e) {}
}

/* ============ 帽子系统：局外资源（苹果总库）+ 永久拥有的帽子 + 当前装备 ============ */
const APPLES_KEY = 'rapid_snake_apples';   // 苹果总库（局外资源，抽装饰用）
const HATS_KEY   = 'rapid_snake_hats_owned'; // 永久拥有的帽子 id 列表
const SKINS_KEY  = 'rapid_snake_skins_owned';// 永久拥有的皮肤 id 列表（green 默认）
const SCENES_KEY = 'rapid_snake_scenes_owned';// 永久拥有的场景 id 列表（green 默认）
const EQUIP_KEY  = 'rapid_snake_hat_equip';  // 当前装备的帽子 id
const EQUIP_SKIN = 'rapid_snake_skin_equip'; // 当前装备的皮肤 id
const EQUIP_SCENE= 'rapid_snake_scene_equip';// 当前装备的场景 id
const CH_KEY     = 'rapid_snake_ch_own';      // 自制帽子数据 [{id,px}]，px 为 20×20 像素
const CH_EQUIP   = 'rapid_snake_ch_equip';    // 当前装备的自制帽子 id
const HAT_COST   = 20;                        // 抽一次需要的苹果数
const CH_MAX     = 12;                        // 自制帽子最多保存 12 顶
const CH_CELLS   = 20;                        // 自制帽子画板：20×20 像素
/* 帽子美术内置在 HTML 中（base64 data URL），不依赖外部图片文件。
 * 若要在"帽子"文件夹新增帽子：把新 PNG 转成 base64 后，按 HAT_IDS/下面
 * "内置帽子"的格式加入新条目 + 在 HAT_DATA 中注册即可，全屏都能显示。 */
const HAT_IDS = ['cowboy', 'crown', 'tophat', 'wreath', 'goldhelmet', 'diamond', 'iron'];
const HAT_META = {
  cowboy: { name: '牛仔帽' },
  crown:  { name: '王冠' },
  tophat: { name: '高顶帽' },
  wreath:     { name: '花环' },
  goldhelmet: { name: '金头盔' },
  diamond:    { name: '钻石头盔' },
  iron:       { name: '铁头盔' },
};

/* ============ 蛇皮肤：默认绿 + 可抽取（黄/蓝/青） ============ */
const SKIN_IDS  = ['green', 'yellow', 'blue', 'cyan', 'pink', 'purple', 'orange'];
const DRAW_SKINS = ['yellow', 'blue', 'cyan', 'pink', 'purple', 'orange'];  // 可抽取的皮肤（green 为默认，不抽）
const SKIN_META = {
  green:  { name: '经典绿',  colors: { body: '#7cb93f', head: '#5c9c2b', line: '#17350a', hi: '#aedd72', eye: '#f4f8e8', pupil: '#0c1106' } },
  yellow: { name: '黄蛇',    colors: { body: '#e0c02e', head: '#c9a71c', line: '#5a4a08', hi: '#f6e68a', eye: '#fff8e0', pupil: '#231a04' } },
  blue:   { name: '蓝蛇',    colors: { body: '#3f7fc9', head: '#2f68b0', line: '#0b2650', hi: '#7fafe0', eye: '#e8f5ff', pupil: '#060d1c' } },
  cyan:   { name: '青蛇',    colors: { body: '#2eb8b0', head: '#20a29b', line: '#08424a', hi: '#7fe0d8', eye: '#eafffc', pupil: '#051d20' } },
  pink:   { name: '粉蛇',    colors: { body: '#f19fb2', head: '#d97e96', line: '#5c2033', hi: '#fbd0da', eye: '#fff5f8', pupil: '#2a0d15' } },
  purple: { name: '紫蛇',    colors: { body: '#9b6fe0', head: '#8349c8', line: '#2a1140', hi: '#c9a8f1', eye: '#f6eeff', pupil: '#12051f' } },
  orange: { name: '橙蛇',    colors: { body: '#f08a2f', head: '#d8721f', line: '#5a2a05', hi: '#f9c06a', eye: '#fff3e0', pupil: '#2a1204' } },
};

/* ============ 场景：默认黑绿 + 可抽取（白黄/白粉/白绿/黑蓝/黑紫） ============ */
const SCENE_IDS  = ['green', 'white', 'pink', 'wgreen', 'blue', 'purple', 'worange'];
const DRAW_SCENES = ['white', 'pink', 'wgreen', 'blue', 'purple', 'worange'];  // 可抽取场景（green 为默认，不抽）
const SCENE_META = {
  green:  { name: '黑绿场景', bg: ['#0c1410', '#070b09'], plat: { body: '#2e4a2c', top: '#b8e86a', bot: 'rgba(0,0,0,0.4)' }, trail: '#9fd44a' },
  white:  { name: '白黄场景', light: true, bg: ['#f4f6ee', '#dfe6d6'], plat: { body: '#e0b93f', top: '#fff1a8', bot: 'rgba(120,90,10,0.3)' }, trail: '#e0c02e' },
  pink:   { name: '白粉场景', light: true, bg: ['#fbeef0', '#f6dde0'], plat: { body: '#f2a0b0', top: '#ffe1e8', bot: 'rgba(120,45,60,0.28)' }, trail: '#f2a0b0' },
  wgreen: { name: '白绿场景', light: true, bg: ['#eef6ec', '#dcecd6'], plat: { body: '#6fae3a', top: '#cdefa0', bot: 'rgba(40,80,15,0.28)' }, trail: '#7cb93f' },
  blue:   { name: '黑蓝场景', bg: ['#0a1018', '#060a10'], plat: { body: '#2f5f8a', top: '#7fc0e8', bot: 'rgba(0,0,0,0.4)' }, trail: '#6fb4e0' },
  purple: { name: '黑紫场景', bg: ['#150f1c', '#09070e'], plat: { body: '#553a7a', top: '#c9a0f0', bot: 'rgba(0,0,0,0.4)' }, trail: '#b48ce8' },
  worange:{ name: '白橙场景', light: true, bg: ['#fdf6ee', '#f7e9d9'], plat: { body: '#ef8f2f', top: '#ffd9a0', bot: 'rgba(140,70,10,0.3)' }, trail: '#f39a45' },
};

/* 所有可抽取装饰品（共用奖池，抽过即不再出现，抽完即止） */
const DECOR_POOL = [
  ...HAT_IDS.map(id => ({ id, cat: 'hat' })),
  ...DRAW_SKINS.map(id => ({ id, cat: 'skin' })),
  ...DRAW_SCENES.map(id => ({ id, cat: 'scene' })),
];
function decoName(item) {
  if (item.cat === 'hat') return HAT_META[item.id].name;
  if (item.cat === 'ch') return chName(item.id);
  if (item.cat === 'skin') return SKIN_META[item.id].name;
  return SCENE_META[item.id].name;
}
/* 装饰类别辅助：按类别读写"已拥有"与"当前装备" */
function ownedOf(cat) {
  if (cat === 'hat') return ownedHats;
  if (cat === 'ch') return chIds();
  if (cat === 'skin') return ownedSkins;
  return ownedScenes;
}
function equippedOf(cat) {
  if (cat === 'hat') return equippedHat;
  if (cat === 'ch') return equippedCh;
  if (cat === 'skin') return equippedSkin;
  return equippedScene;
}
function isOwned(item) { return ownedOf(item.cat).indexOf(item.id) >= 0; }
function addOwned(item) { const arr = ownedOf(item.cat); if (arr.indexOf(item.id) < 0) arr.push(item.id); }
function setEquipped(item) {
  if (item.cat === 'hat') { equippedHat = item.id; equippedCh = null; }   // 普通帽与自制帽互斥
  else if (item.cat === 'ch') { equippedCh = item.id; equippedHat = null; }
  else if (item.cat === 'skin') equippedSkin = item.id;
  else equippedScene = item.id;
}
/* 穿戴自制帽子（自动卸下普通帽子） */
function wearCh(id) { setEquipped({ id, cat: 'ch' }); saveHatData(); }
let decorTab = 'skin';  // 装饰界面当前标签：hat | skin | scene（默认打开皮肤页）
/* —— 内置帽子（base64 编码的 PNG） —— */

/* 浮动箭头：指向按钮用的上下浮动引导箭头（朝下，画在按钮上方） */
function drawTutorArrow(cx, top, color) {
  const bob = Math.sin(nowMs / 240) * 7;
  const y = top + bob;
  ctx.fillStyle = color;
  // 方形柄（竖直矩形条）
  ctx.fillRect(cx - 7, y, 14, 22);
  // 朝下三角箭头
  ctx.beginPath();
  ctx.moveTo(cx - 12, y + 20);
  ctx.lineTo(cx + 12, y + 20);
  ctx.lineTo(cx, y + 36);
  ctx.closePath();
  ctx.fill();
}

/* ============ 工具函数 ============ */
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

/* 十六进制颜色混色：a 为底色，向 b 过渡 t（0~1） */
function blendHex(a, b, t) {
  const ia = parseInt(a.slice(1), 16), ib = parseInt(b.slice(1), 16);
  const r = Math.round((ia >> 16 & 255) + ((ib >> 16 & 255) - (ia >> 16 & 255)) * t);
  const g = Math.round((ia >> 8 & 255) + ((ib >> 8 & 255) - (ia >> 8 & 255)) * t);
  const bl = Math.round((ia & 255) + ((ib & 255) - (ia & 255)) * t);
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + bl).toString(16).slice(1);
}

/* 随机"空隙"格数（从 4 / 8 / 12 中随机；平台行差 = 空隙 + 1） */
function randGap() {
  return GAP_CHOICES[Math.floor(Math.random() * GAP_CHOICES.length)];
}

/* ============ 平台生成（世界格坐标） ============
 * 平台 = 6 格宽 × 1 格高的方块，属于固定的世界地形（世界坐标不变）。
 * 视觉滚动 = 镜头向下移动（camR 递增），画面顶对应的世界行就是 camR。
 * 尖刺：平台上每一格独立按概率生成（可在任意格、一个平台可有多个刺）；
 * 但每连续 3 个"带刺平台"之后，强制生成一个完全无刺的平台。
 * 返回 { c, r, w, h, spikes }  spikes: 平台顶面上的尖刺
 */
let spikeStreak = 0;              // 连续带刺平台数（无刺平台会打断累计）
let forceNoSpike = false;         // 下一次生成的平台强制不带刺

function makePlatform(r) {
  const c = Math.floor(Math.random() * (GRID_W - PLAT_W));   // 水平位置随机
  const spikes = [];
  const prob = Math.min(SPIKE_MAX, SPIKE_BASE + (demoOn ? demoTime : gameTime) * SPIKE_ACCEL);   // 每格概率
  let hasSpike = false;
  if (!forceNoSpike) {
    // 平台上每一格（含最左/最右）独立判定是否带刺
    for (let col = 0; col < PLAT_W; col++) {
      if (Math.random() < prob) {
        spikes.push({ col, px: (c + col) * CELL + CELL / 2 });   // px: 刺中心X（世界像素）
        hasSpike = true;
      }
    }
  }
  // 连续 3 个带刺平台后，下一个强制无刺；无刺平台出现会打断累计（重新计数）
  if (forceNoSpike) {
    forceNoSpike = false;         // 本次为强制无刺的平台
    spikeStreak = 0;
  } else if (hasSpike) {
    spikeStreak++;
    if (spikeStreak >= 3) forceNoSpike = true;   // 连续 3 个带刺 → 下一个强制无刺
  } else {
    spikeStreak = 0;              // 无刺平台打断累计
  }
  return { c, r, w: PLAT_W, h: PLAT_H, spikes };
}

/* 初始铺满一批平台（camR=0 时覆盖整屏及屏幕下方） */
function buildInitialPlatforms() {
  const arr = [];
  let r = -1;
  while (r < GRID_H + 2) {
    arr.push(makePlatform(r));
    r += randGap() + 1;           // 行差 = 空隙(4/8/12) + 平台自身高度 1
  }
  return arr;
}

/* ============ 镜头向下推进一格（无限世界，平台只当地形、从不推蛇） ============
 * 平台、苹果、蛇都是世界坐标，镜头下移只改 camR：
 * - 底部：保证镜头能看到的地方都有平台，不断向下生成新地形；
 * - 顶部：已滚出镜头视野的平台销毁；
 * - 苹果滚出视野顶部即消失。
 */
function stepWorld() {
  camR += 1;   // 镜头向下走一格 = 原“所有内容上移一格”的视觉效果
  // 底部持续生成新平台（像刺一样：平台生成时，若场上没有苹果就带上一个）
  const bottom = platforms[platforms.length - 1];
  if (bottom.r - camR < GRID_H) {
    const np = makePlatform(bottom.r + randGap() + 1);   // 行差 = 空隙(4/8/12) + 平台自身高度 1
    platforms.push(np);
    if (apple === null) attachAppleTo(np);
  }
  // 顶部销毁已滚出镜头视野的平台（苹果随之消失）
  while (platforms.length && platforms[0].r + platforms[0].h <= camR) {
    if (apple && apple.plat === platforms[0]) apple = null;
    platforms.shift();
  }
  // 苹果滚出视野顶部 → 消失（世界中的苹果不动，只是镜头过去了）
  if (apple && apple.r < camR) apple = null;
}

/* ============ 蛇的出生：横着躺在屏幕中部的一个平台上 ============ */
function placeSnake() {
  let target = null;
  for (const p of platforms) {
    if (p.r > 8 && p.r < 30) { target = p; break; }
  }
  if (!target) target = platforms[Math.floor(platforms.length / 2)];
  target.spikes.length = 0;       // 清除出生平台上的尖刺，保证安全出生

  const hr = target.r - 1;        // 蛇头格 = 平台上方一格（底部贴着平台顶面）
  const hc = target.c + 2;        // 平台左缘起第 3 格
  snake = [
    { c: hc, r: hr },             // 蛇头
    { c: hc + 1, r: hr }          // 蛇身第 1 节（横在蛇头右侧）
  ];
  headDir = 'left';
  growPending = 0;
  fallTimer = 0;
  fallInterval = FALL_START;
  if (apple === null) attachAppleTo(target);   // 出生平台带上苹果，一开局就能看见
}

  clearInputState();
  settingsFrom = 'ready';
  goReady();
}

/* ============ 死亡处理 ============ */
function die() {
  if (state !== 'playing') return;
  state = 'dead';
  deathAt = nowMs;
  sndDeath();   // 播放死亡音效
  newRecord = false;
  if (score > best) {
    best = score;
    newRecord = true;
    try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {}
  }
  // 本局吃到的苹果计入局外"苹果总库"（抽帽子资源），每死一局结算一次
  lastRunApples = runApples;
  appleBank += runApples;
  runApples = 0;
  saveHatData();
}

function playEatSound() {
  if (!soundOn) return;              // 音效开关：关闭时不吃苹果音效

/* 死亡音效：8-bit 风格"womp"——方波快速下滑 + 兜底短促 buzz，复古坠落感 */
function sndDeath() {
  if (!soundOn) return;              // 音效开关：关闭时不出死亡音效
  const c = sndCtx(); if (!c) return;
  let t = c.currentTime;
  const master = c.createGain();
  master.gain.value = 0.28;
  master.connect(c.destination);
  // 主"womp"：方波 520→70Hz，约 0.3 秒滑落
  const o1 = c.createOscillator(); o1.type = 'square';
  o1.frequency.setValueAtTime(520, t);
  o1.frequency.exponentialRampToValueAtTime(70, t + 0.32);
  const g1 = c.createGain();
  g1.gain.setValueAtTime(0.5, t);
  g1.gain.exponentialRampToValueAtTime(0.001, t + 0.34);
  o1.connect(g1); g1.connect(master);
  o1.start(t); o1.stop(t + 0.36);
  // 兜底"buzz"：锯齿波 210→50Hz，更短更急促，强化坠落感
  t += 0.05;
  const o2 = c.createOscillator(); o2.type = 'sawtooth';
  o2.frequency.setValueAtTime(210, t);
  o2.frequency.exponentialRampToValueAtTime(50, t + 0.18);
  const g2 = c.createGain();
  g2.gain.setValueAtTime(0.30, t);
  g2.gain.exponentialRampToValueAtTime(0.001, t + 0.20);
  o2.connect(g2); g2.connect(master);
  o2.start(t); o2.stop(t + 0.22);
}

/* ============ 位置 (c, r) 是否有"有效支撑" ============
 * - 正下方一格是平台顶面 → 站在平台上，有支撑
 * - 或正下方一格是自己的蛇身节（蛇头踩在身体上）→ 只要这条蛇身里
 *   有任意一节被平台托住（整条身体链被平台拉住），蛇头就站得住；
 *   只有整条蛇都悬空、没有一节搭在平台上时，才允许蛇整体下落。
 */
function hasSupport(c, r) {
  // 1) 正下方一格是平台顶面 → 站在平台上
  for (const p of platforms) {
    if (r + 1 === p.r && c >= p.c && c < p.c + p.w) return true;
  }
  // 2) 正下方一格是自己的蛇身节（踩在身体上）
  let underBody = false;
  for (let i = 1; i < snake.length; i++) {
    if (snake[i].r === r + 1 && snake[i].c === c) { underBody = true; break; }
  }
  if (!underBody) return false;
  // 蛇身链上只要存在被平台承托的节（骑在平台顶 / 陷在平台内被托住），
  // 整条身体就被平台拉住，蛇头不会带着身体凭空下坠、把平台段撕开
  for (let i = 1; i < snake.length; i++) {
    const s = snake[i];
    for (const p of platforms) {
      if (s.r + 1 === p.r && s.c >= p.c && s.c < p.c + p.w) return true;             // 该节骑在平台顶
      if (s.c >= p.c && s.c < p.c + p.w && s.r >= p.r && s.r < p.r + p.h) return true; // 该节陷在平台内
    }
  }
  return false;
}

/* ============ 蛇的移动：蛇头点一下走一格（只允许 上/左/右）；成功返回 true，被挡返回 false ============ */
function moveSnake(dc, dr) {
  if ((state !== 'playing' && !demoOn) || !snake.length) return false;
  // 0) 禁止 180° 掉头：蛇头朝左时不能直接向右（要先转上/下，蛇身让开再走）
  if ((dc < 0 && headDir === 'right') || (dc > 0 && headDir === 'left')) return false;
  const h = snake[0];
  const nc = h.c + dc;
  const nr = h.r + dr;

  // 1) 屏幕左右边界
  if (nc < 0 || nc >= GRID_W) return false;

  // 2) 平台是实心的，蛇头不能走进平台格子
  for (const p of platforms) {
    if (nc < p.c + p.w && nc > p.c - 1 &&
        nr < p.r + p.h && nr > p.r - 1) return false;
  }

  // 3) 不能穿过自己的蛇身（含尾巴：蛇头不能进入任何一节蛇身所在的格子）
  for (let i = 1; i < snake.length; i++) {
    if (snake[i].c === nc && snake[i].r === nr) return false;
  }

  // 通过检查 → 蛇头前进一格；蛇头离开的旧格立即变成一节蛇身，最末尾的蛇身消失
  // （若吃到苹果待生长：不消失末尾，蛇变长一节）
  snake.unshift({ c: nc, r: nr });   // 蛇头前进，旧蛇头自然退为第一节蛇身
  if (growPending > 0) growPending--;      // 生长中：保留尾巴（长一节）
  else snake.pop();                        // 平常：最末尾的蛇身消失一节
  if (dc < 0) headDir = 'left';
  else if (dc > 0) headDir = 'right';
  else if (dr < 0) headDir = 'up';
  return true;
}

/* ============ 蛇的移动：悬空时蛇头自动逐格下落（越掉越快），身体随之队列跟随 ============ */
function stepDown() {
  const nx = snake[0].c, nr = snake[0].r + 1;
  // 蛇头正下方正好被自己的身体占着（垂直悬挂的蛇链）→ 整条一起下落一格，
  // 保持蛇的形态（不会蛇头掉进自己身体里）
  let downBlocked = false;
  for (let i = 1; i < snake.length; i++) {
    if (snake[i].c === nx && snake[i].r === nr) { downBlocked = true; break; }
  }
  if (downBlocked) {
    for (const s of snake) s.r += 1;
    // 兜底：某节若因此陷入平台格，把它顶回原位（不穿平台）
    for (let i = 1; i < snake.length; i++) {
      for (const p of platforms) {
        if (snake[i].c >= p.c && snake[i].c < p.c + p.w &&
            snake[i].r >= p.r && snake[i].r < p.r + p.h) { snake[i].r -= 1; break; }
      }
    }
  } else {
    // 蛇头向下走一格：旧格立即变成蛇身（unshift 后旧蛇头自然退为第一节），
    // 最末尾一节消失；影子队列保证蛇身始终连着蛇头、不会断开
    snake.unshift({ c: nx, r: nr });
    if (growPending > 0) growPending--;   // 吃到苹果待生长：保留尾巴
    else snake.pop();                     // 平常：最末尾的蛇身消失
  }
  headDir = 'down';   // 蛇头朝下：下落途中左右都可以自由转向（不会被当成"掉头"挡掉）
  // 落到平台顶面或有效的蛇身垫脚上 → 着落，停止下落
  if (hasSupport(snake[0].c, snake[0].r)) {
    fallTimer = 0;
    fallInterval = FALL_START;
    squash = 1;                                       // 着落压扁反馈
  }
}

/* ============ 每帧更新蛇 ============ */
function updateSnake(dt) {
  const h = snake[0];

  // 1) 悬空时逐格下落
  if (!hasSupport(h.c, h.r)) {
    fallTimer += dt;
    if (fallTimer >= fallInterval) {
      fallTimer = 0;
      fallInterval = Math.max(0.05, fallInterval * 0.88);   // 间隔越来越短 = 越掉越快
      stepDown();
      if (snake[0].r - camR > GRID_H + 2) { onSnakeDeath(); return; }  // 掉出屏幕底部（演示与对局统一处理：对局结束、演示等重生）
    }
  } else {
    fallTimer = 0;   // 蛇头有支撑：计时清零
  }

  // 2) 尖刺碰撞：蛇头或任何一节蛇身碰到尖刺 → 游戏结束
  for (const p of platforms) {
    for (const sp of p.spikes) {
      const baseY = p.r * CELL;
      const tip = { x: sp.px, y: baseY - SPIKE_H };
      const b1  = { x: sp.px - SPIKE_HW, y: baseY };
      const b2  = { x: sp.px + SPIKE_HW, y: baseY };
      for (const s of snake) {
        const sx = s.c * CELL + CELL / 2, sy = s.r * CELL + CELL / 2;
        if (circleVsTriangle(sx, sy, SEG_R, tip, b1, b2)) { onSnakeDeath(); return; }
      }
    }
  }

  // 4) 吃苹果：蛇头走到苹果格 → +5 分并标记待生长（下次蛇头移动/下落时尾不消、长一节）
  if (apple && snake[0].c === apple.c && snake[0].r === apple.r) {
    if (!demoOn) { score += 5; runApples += 1; playEatSound(); }   // 演示模式只吃不长分、不存档、不出声
    growPending = 1;
    apple = null;
    // 苹果被吃后，下一个新生成的平台会带上新苹果
  }

  // 4) 死亡判定：蛇被镜头追上滚出屏幕顶部（蛇行小于镜头所在行）
  if (snake[0].r < camR) { onSnakeDeath(); }
}

/* ============ 穿模/重合兜底：每帧最后（绘制前）执行 ============
 * 1) 蛇节若与平台格重叠 → 顶到平台顶面上方最近的空格（不穿进其它蛇身节）
 * 2) 若仍有任意两节同格（理论不该发生）→ 把靠后的一节向上移出，杜绝重合
 */
function resolvePenetration() {
  for (let i = 0; i < snake.length; i++) {
    const s = snake[i];
    for (const p of platforms) {
      if (s.c >= p.c && s.c < p.c + p.w && s.r >= p.r && s.r < p.r + p.h) {
        for (let rr = p.r - 1; rr > p.r - 12; rr--) {
          if (!snake.some((o, j) => j !== i && o.c === s.c && o.r === rr)) { s.r = rr; break; }
        }
        break;
      }
    }
  }
  for (let i = 1; i < snake.length; i++) {
    const s = snake[i];
    let clash = false;
    for (let j = 0; j < i; j++) {
      if (snake[j].c === s.c && snake[j].r === s.r) { clash = true; break; }
    }
    if (!clash) continue;
    for (let rr = s.r - 1; rr > s.r - 12; rr--) {
      if (!snake.some(o => o.c === s.c && o.r === rr)) { s.r = rr; break; }
    }
  }
}

/* ============ 苹果（像刺一样：平台生成时就带上苹果） ============ */
function attachAppleTo(p) {
  // 该平台带刺的列（相对列），苹果绝不落在有刺的那一格
  const spikeCols = p.spikes.map(sp => sp.col);
  const free = [];
  for (let col = 0; col < p.w; col++) if (spikeCols.indexOf(col) < 0) free.push(col);
  if (free.length === 0) { apple = null; return; }   // 整块平台都带刺：这轮不放苹果，等下一个平台
  const r = p.r - 1;   // 苹果位于平台顶面上方一格
  for (let tries = 0; tries < 20; tries++) {
    const c = p.c + free[Math.floor(Math.random() * free.length)];  // 只在无刺列里挑
    if (snake.some(s => s.c === c && s.r === r)) continue;          // 不和蛇重迭
    apple = { c, r, plat: p };
    return;
  }
  // 蛇占满无刺列才兜底：仍从无刺列里随机挑
  const c = p.c + free[Math.floor(Math.random() * free.length)];
  apple = { c, r, plat: p };
}

/* ============ 圆 vs 三角形 精确碰撞 ============ */
function sign(px, py, ax, ay, bx, by) {
  return (bx - ax) * (py - ay) - (by - ay) * (px - ax);
}
function pointInTri(px, py, ax, ay, bx, by, cx, cy) {
  const d1 = sign(px, py, ax, ay, bx, by);
  const d2 = sign(px, py, bx, by, cx, cy);
  const d3 = sign(px, py, cx, cy, ax, ay);
  const hasNeg = d1 < 0 || d2 < 0 || d3 < 0;
  const hasPos = d1 > 0 || d2 > 0 || d3 > 0;
  return !(hasNeg && hasPos);
}
function segDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  const l2 = dx * dx + dy * dy;
  let t = l2 > 0 ? ((px - ax) * dx + (py - ay) * dy) / l2 : 0;
  t = Math.max(0, Math.min(1, t));
  const cx = ax + t * dx, cy = ay + t * dy;
  return Math.hypot(px - cx, py - cy);
}
function circleVsTriangle(cx, cy, cr, tip, b1, b2) {
  if (pointInTri(cx, cy, tip.x, tip.y, b1.x, b1.y, b2.x, b2.y)) return true;
  if (segDist(cx, cy, tip.x, tip.y, b1.x, b1.y) <= cr) return true;
  if (segDist(cx, cy, b1.x, b1.y, b2.x, b2.y) <= cr) return true;
  if (segDist(cx, cy, b2.x, b2.y, tip.x, tip.y) <= cr) return true;
  return false;
}

/* ============ 主更新循环 ============ */
function update(dt) {
  squash = Math.max(0, squash - dt * 5.5);
  // 主菜单背景：自动演示游玩（纯表演，不记分不吃存档）
  if (state === 'ready' && demoOn) { demoUpdate(dt); return; }
  if (state !== 'playing') return;
  gameTime += dt;
  score += dt;                    // 时间记分：每生存 1 秒 +1 分
  scrollSpeed = Math.min(SCROLL_MAX, SCROLL_BASE + gameTime * SCROLL_ACCEL);
  // 镜头向下滚动：每帧最多推进 1 格（世界固定，镜头走；蛇不被镜头推）
  scrollAcc += scrollSpeed * dt;
  if (scrollAcc >= CELL) {
    scrollAcc -= CELL;
    stepWorld();          // 1) 镜头下移一格 + 地形维护（生成/销毁）
  }
  // 2) 蛇头移动
  //    点按（pendingMove）：连点最多每 1/6 秒一格（tapCd）
  //    长按（heldDir）：按住持续移动每 1/4 秒一格（holdCd）
  if (pendingMove) {
    tapCd += dt;
    if (tapCd >= TAP_INTERVAL) {
      tapCd = 0;
      moveSnake(pendingMove[0], pendingMove[1]);
      pendingMove = null;
    }
  } else if (heldDir) {
    holdCd += dt;
    if (holdCd >= HOLD_INTERVAL) {
      holdCd = 0;
      moveSnake(heldDir[0], heldDir[1]);
    }
  } else {
    // 无输入：冷却缓慢回满，保证下一次按键能立刻响应
    tapCd = Math.min(TAP_INTERVAL, tapCd + dt);
    holdCd = Math.min(HOLD_INTERVAL, holdCd + dt);
  }
  updateSnake(dt);          // 3) 蛇头下落（悬空时逐格下落）、刺/苹果/死亡判定
  resolvePenetration();     // 4) 绘制前的穿模/重合兜底
  // 蛇头拖尾残影记录
  if (snake.length) {
    const hx = snake[0].c * CELL + CELL / 2, hy = snake[0].r * CELL + CELL / 2;
    trailFx.push({ x: hx, y: hy });
    if (trailFx.length > 14) trailFx.shift();
  }
}

/* ============ 主菜单背景自动演示 ============
 * 蛇会像真人一样在主菜单背景自动游玩：固定速度向下滚动、主动追苹果、
 * 躲避尖刺与屏幕边缘；死亡后稍作停顿自动重生。纯观赏，不记分、不碰存档。
 */
let demoOn = false;       // 是否正在自动演示
let demoDead = false;     // 演示蛇已死亡（短暂停顿等重生）
let demoDeadAt = 0;       // 演示死亡时刻（毫秒）
let demoTime = 0;         // 演示运行秒数（供尖刺概率参考）
let demoT = 0;            // 自动决策计时
const DEMO_SCROLL = 40;   // 演示镜头滚动速度 px/s（固定 2 格/秒，玩家选定的匀速）
const DEMO_STEP = 0.20;   // 自动决策间隔（≈游戏内点按的走格节奏）

/* 统一回主菜单入口：回主菜单就启动背景演示 */
function goReady() {
  clearInputState();
  resetAsk = false;
  settingsFrom = 'ready';
  hatPrompt = null;
  state = 'ready';
  startDemo();
}
/* 关闭设置界面：来自对局→继续对局；来自主菜单→回主菜单（重启演示） */
function closeSettings() {
  clearInputState();
  resetAsk = false;
  if (settingsFrom === 'playing') state = 'playing';
  else goReady();
}
/* 启动一局全新的演示：重建世界与出生蛇（不动任何存档数据） */
function startDemo() {
  if (state !== 'ready') return;
  demoOn = true;
  demoDead = false;
  demoTime = 0;
  demoT = 0;
  camR = 0;
  scrollAcc = 0;
  apple = null;
  spikeStreak = 0;        // 尖刺连续计数复位（每 3 个带刺平台后必有无刺）
  forceNoSpike = false;
  trailFx = [];
  platforms = buildInitialPlatforms();
  placeSnake();
}
/* 演示蛇死亡：进入"停顿等重生"，而不是结束游戏 */
function onSnakeDeath() {
  if (demoOn && state === 'ready') {
    demoDead = true;
    demoDeadAt = nowMs;
  } else {
    die();
  }
}
/* 演示主更新：固定速度滚动 + 自动决策 + 复用真实下落/吃苹果/死亡判定 */
function demoUpdate(dt) {
  if (!demoOn || state !== 'ready') return;
  if (demoDead) {                                   // 死亡后短暂停顿再重生
    if (nowMs - demoDeadAt > 700) {
      demoDead = false;
      startDemo();
    }
    return;
  }
  scrollAcc += DEMO_SCROLL * dt;                    // 恒定匀速（玩家选定）
  while (scrollAcc >= CELL) { scrollAcc -= CELL; stepWorld(); }
  demoTime += dt;
  demoT += dt;
  if (demoT >= DEMO_STEP) {                         // 固定节奏做决定
    demoT = 0;
    demoSteer();
  }
  updateSnake(dt);                                  // 下落/吃苹果/死亡判定（演示分支不结算）
  resolvePenetration();
}

/* —— 演示 AI：自动走位 —— */
/* (c,r) 正下方被哪块平台的顶面托着（有支撑则返回该平台） */
function platUnder(c, r) {
  for (const p of platforms) if (p.r === r + 1 && c >= p.c && c < p.c + p.w) return p;
  return null;
}
/* 平台 p 的 c 列是否带尖刺 */
function pSpikedAt(p, c) { return p.spikes.some(s => p.c + s.col === c); }
/* 平台 p 上离 prefer 最近的无刺列；若整块带刺则回最左列（兜底） */
function safeColOn(p, prefer) {
  let bc = -1, bd = 1e9;
  for (let i = 0; i < p.w; i++) {
    const cc = p.c + i;
    if (pSpikedAt(p, cc)) continue;
    const d = Math.abs(cc - prefer);
    if (d < bd) { bd = d; bc = cc; }
  }
  return bc >= 0 ? bc : p.c;
}
/* 顶面行 ≥ r 的最近一块平台（用于判定"即将落到哪"） */
function firstPlatAtOrBelow(r) {
  let bp = null;
  for (const p of platforms) if (p.r >= r && (!bp || p.r < bp.r)) bp = p;
  return bp;
}
/* 走一格（失败静默，由物理自然兜底） */
function demoMove(dc) { if (dc) moveSnake(dc, 0); }
/* 反向被挡时：向上"抬一下"立刻落回，从而调转方向 */
function demoPivot() { moveSnake(0, -1); }

/* 悬空时想去哪一列（优先追下方可见的苹果，否则向画面中间看齐） */
function demoAirGoal(h) {
  if (apple && apple.r > h.r && apple.r - camR < GRID_H) return apple.c;
  const p = firstPlatAtOrBelow(h.r + 1);
  return p ? safeColOn(p, h.c) : -1;
}
/* 平台 ride 上蛇头能否一路走到左/右边缘（沿途不得有尖刺挡路） */
function rideExitOK(ride, h, side) {
  const cols = ride.spikes.map(s => ride.c + s.col);
  if (side < 0) return !cols.some(c => c >= ride.c && c < h.c);
  return !cols.some(c => c > h.c && c < ride.c + ride.w);
}
/* 站在平台上时：选出走哪边的边缘去下坠（优先朝苹果方向，被刺封就换边） */
function demoExitDir(ride, h) {
  const leftD = h.c - ride.c, rightD = ride.c + ride.w - 1 - h.c;
  let pref = 0;                                   // 偏好方向
  if (apple && apple.r > h.r && apple.r - h.r < 18) pref = apple.c > h.c ? 1 : (apple.c < h.c ? -1 : 0);
  else pref = (GRID_W >> 1) > h.c ? 1 : ((GRID_W >> 1) < h.c ? -1 : 0);
  const canL = rideExitOK(ride, h, -1), canR = rideExitOK(ride, h, 1);
  if (pref > 0 && canR) return 1;                 // 想去右边且能走 → 右
  if (pref < 0 && canL) return -1;
  if (canL && canR) return pref !== 0 ? -pref : (leftD <= rightD ? -1 : 1);   // 偏好被挡，走另一边
  if (canL) return -1;
  if (canR) return 1;
  return pref >= 0 ? 1 : -1;                      // 两边都被刺封：任选（注定会死，只是时间问题）
}
/* 一次自动决策：挑一列，走或停留 */
function demoSteer() {
  const h = snake[0];
  if (!h || !snake.length || state !== 'ready') return;
  const ride = platUnder(h.c, h.r);
  if (!ride) {
    // —— 悬空：往目标列修正 ——
    let goal = demoAirGoal(h);
    const about = platUnder(h.c, h.r + 1);          // 再落一格就会踩到的顶面
    if (about && pSpikedAt(about, h.c)) goal = safeColOn(about, h.c);   // 有刺先避
    if (goal < 0) return;
    if (goal > h.c) demoMove(1);
    else if (goal < h.c) demoMove(-1);
    return;
  }
  // —— 站在平台上 ——
  const rowsLeft = h.r - camR;                      // 蛇头距画面顶的行数（越小越危险）
  const tryChase = apple && apple.r === h.r &&
                   apple.c >= ride.c && apple.c < ride.c + ride.w &&
                   rowsLeft > 10;                   // 时间富余才去追本平台的苹果
  if (tryChase) {
    const nc = apple.c > h.c ? h.c + 1 : (apple.c < h.c ? h.c - 1 : h.c);
    const rev = (apple.c > h.c && headDir === 'left') || (apple.c < h.c && headDir === 'right');
    if (rev) { demoPivot(); return; }               // 想回头吃：先抬一下掉头
    if (nc !== h.c && nc >= ride.c && nc < ride.c + ride.w && !pSpikedAt(ride, nc)) {
      demoMove(apple.c > h.c ? 1 : -1);
      return;
    }
    // 苹果被刺/边缘挡住吃不到 → 放弃，转入下坠（不停留）
  }
  // 下坠：往能走通的一边走，走出平台边缘自然落到下一层
  let dc = demoExitDir(ride, h);
  // 时间很紧时直接走最近的边缘，别管方向偏好
  if (rowsLeft < 12) {
    const nl = rideExitOK(ride, h, -1), nr = rideExitOK(ride, h, 1);
    const leftD = h.c - ride.c, rightD = ride.c + ride.w - 1 - h.c;
    if (nl && (!nr || leftD <= rightD)) dc = -1;
    else if (nr) dc = 1;
  }
  // 反向约束：不能掉头 → 抬一下，下个决策再走
  if ((dc > 0 && headDir === 'left') || (dc < 0 && headDir === 'right')) { demoPivot(); return; }
  // 贴边时若外侧是画面边界且平台另一边能走，就抬一下转去另一边
  const ncol = h.c + dc;
  if ((ncol < 0 || ncol >= GRID_W) && rideExitOK(ride, h, -dc)) { demoPivot(); return; }
  demoMove(dc);
}

/* ============ 绘制 ============ */
function draw() {
  const scene = SCENE_META[equippedScene] || SCENE_META.green;
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, scene.bg[0]);
  g.addColorStop(1, scene.bg[1]);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // —— 世界层：世界固定，镜头向下走一格 = 画面内容上移一格 ——
  ctx.save();
  ctx.translate(0, -camR * CELL);

  // 平台
  for (const p of platforms) drawPlatform(p);

  // 蛇头拖尾残影
  for (let i = 0; i < trailFx.length; i++) {
    const pt = trailFx[i], f = (i + 1) / trailFx.length;
    ctx.globalAlpha = 0.22 * f;
    ctx.fillStyle = scene.trail;
    ctx.fillRect(pt.x - CELL / 2, pt.y - CELL / 2, CELL, CELL);
  }
  ctx.globalAlpha = 1;

  // 苹果
  if (apple) drawApple(apple);

  // 蛇
  drawSnake();

  // 尖刺（画在最后，保证刺尖可见）
  for (const p of platforms) {
    for (const sp of p.spikes) drawSpike(p.r * CELL, sp.px);
  }

  // 帽子（画在世界层最上方：永远显示在蛇头上面一格，重叠时置顶）
  drawHatOnHead();

  ctx.restore();

  // —— 屏幕层（HUD / 覆盖层不随镜头移动） ——
  if (state === 'playing' || state === 'dead') drawHUD();
  if (state === 'ready') drawReady();
  else if (state === 'hats') drawHatScreen();
  else if (state === 'hatEdit') drawHatEditScreen();
  else if (state === 'settings') drawSettings();
  else if (state === 'dead') drawGameOver();
}

/* 平台：整块绿色方块 + 亮色顶面线（无内部格线） */
function drawPlatform(p) {
  const x = p.c * CELL, y = p.r * CELL, w = p.w * CELL, h = p.h * CELL;
  const pl = (SCENE_META[equippedScene] || SCENE_META.green).plat;
  ctx.fillStyle = pl.body;
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = pl.top;                        // 顶面（可落脚表面）
  ctx.fillRect(x, y, w, 2);
  ctx.fillStyle = pl.bot;                        // 底部暗线
  ctx.fillRect(x, y + h - 2, w, 2);
}

/* 苹果：红色小圆 + 高光 + 小茎 */
function drawApple(a) {
  const x = a.c * CELL + CELL / 2, y = a.r * CELL + CELL / 2;
  ctx.save();
  ctx.shadowColor = '#ff4d3d';
  ctx.shadowBlur = 8;
  ctx.fillStyle = '#ff5148';
  ctx.beginPath();
  ctx.arc(x, y, 7, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.beginPath();
  ctx.arc(x - 2.5, y - 2.5, 2, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#7a5c1f';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(x, y - 7);
  ctx.lineTo(x + 2, y - 10);
  ctx.stroke();
  ctx.restore();
}

/* 蛇：像素连体风——
 * 蛇身节与节紧贴、连成一条（统一绿色、去缝隙、去条纹），
 * 深色像素描边只画在“外侧”（相邻节之间不描边），上表面一条浅色高光，
 * 蛇头略深、带朝向移动方向的方块像素眼。
 */
function drawSnake() {
  let C = (SKIN_META[equippedSkin] || SKIN_META.green).colors;
  // 浅色场景：描边太深会在亮背景下透出一圈"黑边"，改为向蛇身色靠拢
  const scene = SCENE_META[equippedScene] || SCENE_META.green;
  if (scene.light) {
    C = { ...C, line: blendHex(C.body, C.line, 0.1) };
  }
  const PX = 2;                                    // 像素单位（描边/高光/瞳孔均为 PX 整数倍）
  // 判断 (c,r) 是否被其它蛇节占据（用于“是否相连/是否开放面”）
  const hasSeg = (c, r, skip) => {
    for (let k = 0; k < snake.length; k++) {
      if (k !== skip && snake[k].c === c && snake[k].r === r) return true;
    }
    return false;
  };
  // 画一节；ox,oy 为渲染偏移（蛇头压扁时使用局部坐标）
  const seg = (s, i, isHead, ox, oy) => {
    const x = s.c * CELL + ox, y = s.r * CELL + oy;
    const up = hasSeg(s.c, s.r - 1, i), dn = hasSeg(s.c, s.r + 1, i);
    const le = hasSeg(s.c - 1, s.r, i), ri = hasSeg(s.c + 1, s.r, i);
    // 底色（满格铺满 → 相邻节之间无缝隙、连成一体）
    ctx.fillStyle = isHead ? C.head : C.body;
    ctx.fillRect(x, y, CELL, CELL);
    // 像素描边：只画开放的外侧面
    ctx.fillStyle = C.line;
    if (!up) ctx.fillRect(x, y, CELL, PX);
    if (!dn) ctx.fillRect(x, y + CELL - PX, CELL, PX);
    if (!le) ctx.fillRect(x, y, PX, CELL);
    if (!ri) ctx.fillRect(x + CELL - PX, y, PX, CELL);
    // 上表面高光：只有上表面开放时画（水平段连成一条顶部亮线）
    if (!up) {
      ctx.fillStyle = C.hi;
      ctx.fillRect(x + PX, y + PX, CELL - PX * 2, PX);
    }
    // 蛇头：方块像素眼（眼白 6px + 瞳孔 3px，朝向移动方向）
    if (isHead) {
      const cx = x + CELL / 2, cy = y + CELL / 2;
      const horiz = (headDir === 'left' || headDir === 'right');
      const fx = headDir === 'left' ? -1 : headDir === 'right' ? 1 : 0;
      const fy = headDir === 'up' ? -1 : headDir === 'down' ? 1 : 0;
      const centers = horiz
        ? [[fx * 5, -6], [fx * 5, 6]]           // 左右朝向：两眼下上排列
        : [[-6, fy * 5], [6, fy * 5]];          // 上下朝向：两眼左右排列
      for (const [dx, dy] of centers) {
        const ex = cx + dx - 3, ey = cy + dy - 3;   // 眼白左上角（6×6）
        ctx.fillStyle = C.eye;
        ctx.fillRect(ex, ey, 6, 6);
        ctx.fillStyle = C.pupil;
        ctx.fillRect(ex + (fx > 0 ? 3 : fx < 0 ? 0 : 1),
                     ey + (fy > 0 ? 3 : fy < 0 ? 0 : 1), 3, 3);
      }
    }
  };
  // 蛇身（从尾画到头），整格绝对坐标
  for (let i = snake.length - 1; i >= 1; i--) seg(snake[i], i, false, 0, 0);
  // 蛇头（着落压扁效果 + 局部坐标）
  if (snake.length) {
    const h = snake[0];
    ctx.save();
    ctx.translate(h.c * CELL + CELL / 2, h.r * CELL + CELL / 2);
    ctx.scale(1 + squash * 0.3, 1 - squash * 0.3);   // 压扁 → 复原
    ctx.translate(-CELL / 2, -CELL / 2);
    seg(h, 0, true, -h.c * CELL, -h.r * CELL);   // 抵消绝对坐标：在局部原点画，变换只做压扁
    ctx.restore();
  }
}

/* 帽子内容不透明外框（按 HAT_IDS 缓存，裁剪透明边距，让帽子贴合蛇头；hatBBox 已在顶部声明） */
function computeHatBBox(img) {
  if (!hatBBoxCanvas) hatBBoxCanvas = document.createElement('canvas');
  const w = img.naturalWidth, h = img.naturalHeight;
  if (!w || !h) return null;
  hatBBoxCanvas.width = w; hatBBoxCanvas.height = h;
  const c2 = hatBBoxCanvas.getContext('2d', { willReadFrequently: true });
  c2.clearRect(0, 0, w, h);
  c2.drawImage(img, 0, 0);
  let d;
  try { d = c2.getImageData(0, 0, w, h).data; } catch (e) { return null; }
  let minX = w, minY = h, maxX = -1, maxY = -1;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      if (d[(y * w + x) * 4 + 3] > 8) {
        if (x < minX) minX = x; if (x > maxX) maxX = x;
        if (y < minY) minY = y; if (y > maxY) maxY = y;
      }
    }
  }
  if (maxX < 0) return null;
  return { sx: minX, sy: minY, sw: maxX - minX + 1, sh: maxY - minY + 1 };
}

/* ============ 画帽子：裁剪内容并按蛇头朝向旋转（帽子在蛇头后方，底部朝前进方） ============ */
function drawHatOnHead() {
  const hatId = equippedCh || equippedHat;      // 自制帽与普通帽互斥，二选一
  if (!hatId || !snake.length || !hatImgs[hatId] || !hatImgs[hatId].complete) return;
  const img = hatImgs[hatId];
  if (!hatBBox[hatId]) hatBBox[hatId] = computeHatBBox(img);
  const box = hatBBox[hatId];
  const h = snake[0];
  const dir = (typeof headDir === 'string' && headDir.length) ? headDir : 'right';
  // 帽子位置：蛇头反方向一格（后方）；旋转使"底部"朝前进方向
  const BACK_OFF = { up: [0, 1], down: [0, -1], left: [1, 0], right: [-1, 0] };
  const ROT = { up: Math.PI, right: -Math.PI / 2, down: 0, left: Math.PI / 2 };
  const o = BACK_OFF[dir] || [0, -1];
  ctx.imageSmoothingEnabled = false;
  if (!box) {
    // 无法读取像素时退回：画在蛇头后方一格（整图铺满）
    ctx.drawImage(img, (h.c + o[0]) * CELL, (h.r + o[1]) * CELL, CELL, CELL);
    ctx.imageSmoothingEnabled = true;
    return;
  }
  // 数轴：帽子底部落在蛇头上"由行进反方向边缘向内 1/3"那条线上。
  // 锚点从蛇头中心再往反方向退 1/6 格 = 距反方向边缘 1/2 - 1/6 = 1/3 格。
  const ang = (dir in ROT) ? ROT[dir] : 0;
  const dW = CELL, dH = dW * (box.sh / box.sw);
  const ax = h.c * CELL + CELL / 2 + (o[0] * CELL) / 6;   // 锚点 = 距反方向边缘 1/3 格
  const ay = h.r * CELL + CELL / 2 + (o[1] * CELL) / 6;
  ctx.save();
  ctx.translate(ax, ay);      // 旋转原点放在此锚点
  ctx.rotate(ang);
  ctx.drawImage(img, box.sx, box.sy, box.sw, box.sh, -dW / 2, -dH, dW, dH); // 底部(y=0)=锚点线
  ctx.restore();
  ctx.imageSmoothingEnabled = true;
}

/* 尖刺：红色醒目三角形（立在平台顶面上） */
function drawSpike(baseY, sx) {
  ctx.fillStyle = '#ff5b4d';
  ctx.strokeStyle = '#7a1f17';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(sx, baseY - SPIKE_H);
  ctx.lineTo(sx - SPIKE_HW, baseY);
  ctx.lineTo(sx + SPIKE_HW, baseY);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
}

/* 文本配色：按当前场景亮/暗返回一套前景色（亮背景用深色字、暗背景用浅色字） */
function uiPalette() {
  const light = !!(SCENE_META[equippedScene] || SCENE_META.green).light;
  return light ? {
    accent: '#a67c00',                  // 强调色（速度/开始键等）
    strong: '#181818',                  // 主要文字
    dim:    'rgba(25,25,25,0.72)',      // 次要文字
    faint:  'rgba(40,40,40,0.55)',      // 最次要文字
    title:  '#3f7d1d',                  // 菜单标题（深绿）
    body:   '#2c3a26',                  // 菜单正文
    hint:   'rgba(60,80,60,0.55)',      // 底部小字
  } : {
    accent: '#ffd93d',
    strong: '#f0f6ee',
    dim:    'rgba(160,200,170,0.75)',
    faint:  'rgba(160,200,170,0.6)',
    title:  '#9fdc6b',
    body:   '#e8ffe0',
    hint:   'rgba(160,180,160,0.5)',
  };
}

/* HUD：左上角滚动速度 + 右上角实时分数 + 历史最高分 + 蛇长 */
function drawHUD() {
  const P = uiPalette();
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillStyle = P.accent;
  ctx.font = 'bold 22px "Courier New", monospace';
  ctx.fillText('SPD ' + (scrollSpeed / CELL).toFixed(1), 16, 14);
  ctx.textAlign = 'right';
  ctx.textBaseline = 'top';
  ctx.fillStyle = P.strong;
  ctx.font = 'bold 22px "Courier New", monospace';
  ctx.fillText('SCORE ' + score.toFixed(1), W - 16, 14);
  ctx.fillStyle = P.dim;
  ctx.font = 'bold 13px "Courier New", monospace';
  ctx.fillText('BEST ' + best.toFixed(1), W - 16, 42);
  ctx.fillStyle = P.faint;
  ctx.font = '12px "Courier New", monospace';
  ctx.fillText('LEN ' + snake.length, W - 16, 62);
}

/* 设置界面：音效 / 扫描线开关、返回（游戏内还有放弃游戏）在顶部均匀排布，
 * 重置数据按钮固定在底部——绘制 + 点击共用同一组坐标 */
function settingsGeometry() {
  const w = 320, h = 44, cx = W / 2;
  const items = [];
  let y = H / 2 - 132;
  items.push({ key: 'sound', x: cx - w / 2, y, w, h });  y += h + 14;
  items.push({ key: 'scan',  x: cx - w / 2, y, w, h });  y += h + 14;
  items.push({ key: 'back',  x: cx - w / 2, y, w, h });  y += h + 14;
  if (settingsFrom === 'playing') {
    items.push({ key: 'giveup', x: cx - w / 2, y, w, h });
  }
  return { items, reset: { key: 'reset', x: cx - w / 2, y: H - 86, w, h } };
}
/* 重置确认弹窗的按钮区域（绘制 + 点击共用；两个按钮并排置于画布内） */
function confirmLayout() {
  const w = 150, hh = 40, cx = W / 2, cy = H / 2;
  return {
    title: cy - 60,
    text:  cy - 30,
    yes:   { x: cx - w - 10, y: cy, w, h: hh },   // 左："确定"
    no:    { x: cx + 10,     y: cy, w, h: hh }    // 右："取消"
  };
}
/* 通用卡片式按钮底 */
function drawButtonCard(rect) {
  ctx.fillStyle = 'rgba(30,52,36,0.92)';
  ctx.strokeStyle = 'rgba(160,220,120,0.8)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.roundRect(rect.x, rect.y, rect.w, rect.h, 8);
  ctx.fill();
  ctx.stroke();
}
/* 带主文案 + 可选的底部小字说明 */
function drawButton(rect, label, accent, sub) {
  drawButtonCard(rect);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = accent;
  ctx.font = 'bold 16px "Courier New", monospace';
  ctx.fillText(label, rect.x + rect.w / 2, sub ? rect.y + 18 : rect.y + rect.h / 2);
  if (sub) {
    ctx.fillStyle = 'rgba(210,250,225,0.7)';
    ctx.font = '11px "Courier New", monospace';
    ctx.fillText(sub, rect.x + rect.w / 2, rect.y + rect.h - 8);
  }
}
/* 右侧开关拨片：音效 / 扫描线 */
function drawToggle(rect, label, on) {
  drawButtonCard(rect);
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#e8ffe0';
  ctx.font = 'bold 15px "Courier New", monospace';
  ctx.fillText(label, rect.x + 14, rect.y + rect.h / 2);
  const tw = 56, th = 24, tx = rect.x + rect.w - tw - 14, ty = rect.y + (rect.h - th) / 2;
  ctx.fillStyle = on ? '#5dbb62' : '#7a7f78';
  ctx.beginPath();
  ctx.roundRect(tx, ty, tw, th, th / 2);
  ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 13px "Courier New", monospace';
  ctx.textAlign = 'center';
  ctx.fillText(on ? '开' : '关', tx + tw / 2, ty + th / 2);
}
/* 重置数据确认对话框（覆盖层） */
function drawResetConfirm() {
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(0, 0, W, H);
  const C = confirmLayout();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffb0a0';
  ctx.font = 'bold 16px "Courier New", monospace';
  ctx.fillText('确定要清除所有进度吗？', W / 2, C.title);
  ctx.fillStyle = 'rgba(225,225,225,0.75)';
  ctx.font = '12px "Courier New", monospace';
  ctx.fillText('最高分、苹果数和已拥有/装备的装饰都将清空', W / 2, C.text);
  drawButton(C.yes, '确 定', '#ff5b4d');
  drawButton(C.no, '取 消', '#9fdc6b');
}
function drawSettings() {
  ctx.fillStyle = 'rgba(2,6,4,0.88)';
  ctx.fillRect(0, 0, W, H);
  // 标题
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#9fdc6b';
  ctx.font = 'bold 30px "Courier New", monospace';
  ctx.fillText('设 置', W / 2, 74);
  ctx.fillStyle = 'rgba(210,250,225,0.6)';
  ctx.font = '13px "Courier New", monospace';
  ctx.fillText(settingsFrom === 'playing' ? '（游戏已暂停）' : '主菜单', W / 2, 104);
  // 功能项（均匀排布）
  const geo = settingsGeometry();
  for (const it of geo.items) {
    if (it.key === 'sound')        drawToggle(it, '🔊 音效', soundOn);
    else if (it.key === 'scan')    drawToggle(it, '▦ 复古扫描线', scanlineOn);
    else if (it.key === 'back') {
      const backLabel = settingsFrom === 'playing' ? '继续游戏' : '返回主菜单';
      drawButton(it, backLabel, '#ffd93d', isTouch ? undefined : '按 ESC');
    } else if (it.key === 'giveup') {
      drawButton(it, '放弃游戏', '#ff8a5b', '重新开始');
    }
  }
  // 重置游戏数据固定在界面底部

/* ============ 装饰界面（color state 'hats'） ============
 * - 顶部三个标签：皮肤 / 场景 / 帽子（帽子标签显示已拥有/总数），切换查看与装备
 * - 苹果总库 + 剩几件可抽
 * - 每个类别只显示"已拥有"的卡片（默认绿蛇/黑绿场景也在其中），每行固定 4 个
 * - 底部"抽一次 20 苹果"；从共用奖池抽取未拥有的装饰，抽完即止
 */
function decorGeometry() {
  const tabW = 92, tabGap = 8;
  const tabsTotal = 4 * tabW + 3 * tabGap;
  const tabStartX = (W - tabsTotal) / 2;
  const tabs = [
    { key: 'skin',  w: tabW, x: tabStartX,                           label: '皮肤 (' + ownedSkins.length + '/' + SKIN_IDS.length + ')' },
    { key: 'scene', w: tabW, x: tabStartX + (tabW + tabGap),         label: '场景 (' + ownedScenes.length + '/' + SCENE_IDS.length + ')' },
    { key: 'hat',   w: tabW, x: tabStartX + 2 * (tabW + tabGap),     label: '帽子 (' + ownedHats.length + '/' + HAT_IDS.length + ')' },
    { key: 'ch',    w: tabW, x: tabStartX + 3 * (tabW + tabGap),     label: '自制 (' + customHats.length + '/' + CH_MAX + ')' },
  ];
  const list = ownedOf(decorTab);
  // 卡片固定每行 4 个、共 3 行，在底部按钮上方区域内垂直居中
  const gap = 12, topY = 152, cols = 4, rows = 3;
  const areaH = (H - 104 - 8) - topY;      // 卡片可用高度（drawBtn.y=H-104，下方留 8px 间距）
  const n = list.length, cards = [];
  if (n > 0) {
    const cw = Math.floor((W - 24 - (cols - 1) * gap) / cols);
    let ch = Math.floor((areaH - (rows - 1) * gap) / rows);
    ch = Math.min(ch, 150);
    const totalW = cols * cw + (cols - 1) * gap;
    const totalH = rows * ch + (rows - 1) * gap;
    const startX = Math.floor((W - totalW) / 2);
    const startY = topY + Math.floor((areaH - totalH) / 2);
    for (let i = 0; i < n; i++) {
      const row = Math.floor(i / cols), col = i % cols;
      cards.push({ id: list[i], x: startX + col * (cw + gap), y: startY + row * (ch + gap), w: cw, h: ch });
    }
  }
  const drawBtn = { x: W / 2 - 110, y: H - 104, w: 220, h: 48 };
  return { tabs, cards, drawBtn };
}
/* 卡片内的内容预览：帽子/自制帽子→图；皮肤→迷你蛇；场景→迷你背景+平台 */
function drawDecorPreview(cat, id, x, y, w, h) {
  ctx.save();
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, 6);
  ctx.clip();
  if (cat === 'hat' || cat === 'ch') {
    if (hatImgs[id] && hatImgs[id].complete) {
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(hatImgs[id], x, y, w, h);
      ctx.imageSmoothingEnabled = true;
    }
  } else if (cat === 'skin') {
    const C = (SKIN_META[id] || SKIN_META.green).colors;
    ctx.fillStyle = 'rgba(10,18,12,0.5)';
    ctx.fillRect(x, y, w, h);
    const cx = x + w / 2, cy = y + h / 2;
    const u = Math.min(w, h) / 8;
    ctx.fillStyle = C.body;
    ctx.fillRect(cx - 2.5 * u, cy - u, u * 5, 2 * u);          // 蛇身
    ctx.fillStyle = C.hi;
    ctx.fillRect(cx - 2.5 * u, cy - u, u * 5, 2);              // 高光
    ctx.fillStyle = C.line;
    ctx.fillRect(cx - 2.5 * u, cy - u, 2, 2 * u);
    ctx.fillRect(cx - 2.5 * u, cy + u, u * 5, 2);
    ctx.fillStyle = C.head;
    ctx.fillRect(cx + 2.5 * u, cy - u, u, 2 * u);              // 头部
    ctx.fillStyle = C.eye;
    ctx.fillRect(cx + 2.8 * u, cy - 0.8 * u, 0.4 * u, 0.4 * u);
  } else { // scene
    const s = SCENE_META[id] || SCENE_META.green;
    const gg = ctx.createLinearGradient(0, y, 0, y + h);
    gg.addColorStop(0, s.bg[0]); gg.addColorStop(1, s.bg[1]);
    ctx.fillStyle = gg;
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = s.plat.body;
    ctx.fillRect(x + w * 0.12, y + h * 0.58, w * 0.76, h * 0.26);
    ctx.fillStyle = s.plat.top;
    ctx.fillRect(x + w * 0.12, y + h * 0.58, w * 0.76, 3);
    ctx.fillStyle = s.plat.bot;
    ctx.fillRect(x + w * 0.12, y + h * 0.82, w * 0.76, 3);
  }
  ctx.restore();
}

/* 抽一次：消耗 20 苹果，从共用奖池随机抽取一件未拥有的装饰，自动装备；奖池抽完则不能再抽。
 * 返回是否真的抽到（成功 true / 抽空或苹果不足 false），供调用方判断是否完成新手引导 */
function doHatDraw() {
  const avail = DECOR_POOL.filter(it => !isOwned(it));
  if (avail.length === 0) {
    hatPrompt = { msg: '🎁 所有装饰都已抽完', color: '#9fd8c0', t: nowMs };
    return false;
  }
  if (appleBank < HAT_COST) {
    hatPrompt = { msg: '🍎 苹果不足', color: '#ff8a7a', t: nowMs };
    return false;
  }
  appleBank -= HAT_COST;
  const item = avail[Math.floor(Math.random() * avail.length)];
  addOwned(item);
  setEquipped(item);                 // 抽到即自动装备
  decorTab = item.cat;               // 自动跳到抽中装饰所在的类别页（hat/skin/scene）
  hatPrompt = { msg: '★ 获得 ' + decoName(item) + '！已装备', color: '#ffd93d', t: nowMs };
  saveHatData();
  return true;
}

/* ============ 自制帽子：画板编辑器（state 'hatEdit'） ============ */
/* 画板几何：上方工具、中部 20×20 画板 + 右侧 64 色调色板、下方取消/确认 */
function chEditGeom() {
  const cell = 12, N = CH_CELLS;
  const boardW = cell * N, palCols = 8, palRows = 8, s = 12, gap = 2;
  const palW = palCols * s + (palCols - 1) * gap;
  const left = Math.floor((W - (boardW + 14 + palW)) / 2);
  const bX = Math.max(8, left), pX = bX + boardW + 14;
  const bY = 178;
  return {
    board: { x: bX, y: bY, w: boardW, h: boardW, cell },
    pal:   { x: pX, y: bY, cols: palCols, rows: palRows, s, gap },
    tools: [
      { key: 'brush',  x: W / 2 - 124, y: 124, w: 76, h: 32, label: '画笔' },
      { key: 'eraser', x: W / 2 - 38,  y: 124, w: 76, h: 32, label: '橡皮' },
      { key: 'fill',   x: W / 2 + 48,  y: 124, w: 76, h: 32, label: '填充' },
    ],
    cancel: { x: W / 2 - 172, y: H - 90, w: 152, h: 46 },
    ok:     { x: W / 2 + 20,  y: H - 90, w: 152, h: 46 },
  };
}
function chAskGeom() {
  const bw = Math.min(340, W - 40), bx = (W - bw) / 2;
  const rows = [
    { key: 'save',   y: H / 2 - 62 },
    { key: 'nosave', y: H / 2 - 8 },
    { key: 'stay',   y: H / 2 + 46 },
  ];
  for (const r of rows) { r.x = W / 2 - 110; r.w = 220; r.h = 42; }
  return { box: { x: bx, y: H / 2 - 168, w: bw, h: 320 }, title: H / 2 - 132, rows };
}
function inRect(p, r) { return p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h; }
function chEvtXY(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: (e.clientX - rect.left) * (W / rect.width), y: (e.clientY - rect.top) * (H / rect.height) };
}
/* 空白画板：全部像素透明 */
function chBlankGrid() { const a = new Array(CH_CELLS * CH_CELLS); a.fill(-1); return a; }
/* 由像素数组生成可渲染图片（缩略图 / 蛇头穿戴共用）；hatImgs 与普通帽共用一套绘制 */
function chMakeImg(id, px) {
  const c = document.createElement('canvas');
  c.width = CH_CELLS; c.height = CH_CELLS;
  const c2 = c.getContext('2d');
  const d = c2.createImageData(CH_CELLS, CH_CELLS);
  for (let i = 0; i < px.length; i++) {
    const v = px[i], o = i * 4;
    if (v == null || v < 0) { d.data[o + 3] = 0; continue; }
    const col = HAT_PAL[v] || '#000000';
    d.data[o] = parseInt(col.slice(1, 3), 16);
    d.data[o + 1] = parseInt(col.slice(3, 5), 16);
    d.data[o + 2] = parseInt(col.slice(5, 7), 16);
    d.data[o + 3] = 255;
  }
  c2.putImageData(d, 0, 0);
  const im = new Image();
  im.src = c.toDataURL();
  hatImgs[id] = im;
  delete hatBBox[id];
}
/* 打开画板：mode new 新建 / edit 修改 id；from 记录从哪来（settings/hats） */
function openChEditor(mode, id, from) {
  chMode = mode;
  chEditId = (mode === 'edit') ? id : null;
  if (chEditId) {
    const h = customHats.find(x => x.id === chEditId);
    chGrid = h ? h.px.slice() : chBlankGrid();
  } else {
    chGrid = chBlankGrid();
  }
  chTool = 'brush';
  chColor = 7;              // 默认黑色（在透明画布上最显眼）
  chAskExit = false;
  chToast = null;
  chFrom = from;
  chSel = null; chDel = null;
  if (from === 'hats') decorTab = 'ch';
  state = 'hatEdit';
}
/* 离开画板（saved 是否已保存），回到进入前的界面；记录时间戳以吞掉本轮的二次 click */
function chLeave() {
  chAskExit = false;
  chToast = null;
  chLeftTs = Date.now();
  if (chFrom === 'settings') state = 'settings';
  else { decorTab = 'ch'; state = 'hats'; }
}
/* 画板提示（顶部小字） */
function chNote(msg, color) { chToast = { msg, color, t: nowMs }; }
/* 保存：空白禁止、新建超 12 提示已满；修改则覆盖原帽 */
function trySaveCh() {
  if (chGridBlank()) { chNote('请先画点东西再保存', '#ffd93d'); return; }
  let id;
  if (chMode === 'new') {
    if (customHats.length >= CH_MAX) { chNote('自制帽子已满 (' + CH_MAX + '/' + CH_MAX + ')', '#ff8a7a'); return; }
    id = 'ch_' + Date.now();
    customHats.push({ id, px: chGrid.slice() });
  } else {
    id = chEditId;
    const h = customHats.find(x => x.id === id);
    if (h) h.px = chGrid.slice();
  }
  chMakeImg(id, chGrid);
  saveHatData();
  chLeave();
}
/* 单像素上色 / 擦除；拖拽时相邻像素连线 */
function chPaintAt(gx, gy) {
  if (gx < 0 || gy < 0 || gx >= CH_CELLS || gy >= CH_CELLS) return;
  const i = gy * CH_CELLS + gx;
  chGrid[i] = (chTool === 'eraser') ? -1 : chColor;
}
function chPaintLine(gx0, gy0, gx1, gy1) {
  const dx = Math.abs(gx1 - gx0), dy = Math.abs(gy1 - gy0);
  const sx = gx0 < gx1 ? 1 : -1, sy = gy0 < gy1 ? 1 : -1;
  let err = dx - dy, x = gx0, y = gy0;
  for (; ;) {
    chPaintAt(x, y);
    if (x === gx1 && y === gy1) break;
    const e2 = 2 * err;
    if (e2 > -dy) { err -= dy; x += sx; }
    if (e2 < dx) { err += dx; y += sy; }
  }
}
/* 油漆桶填充：连通同色区域替换成当前颜色 */
function chFlood(gx, gy) {
  if (gx < 0 || gy < 0 || gx >= CH_CELLS || gy >= CH_CELLS) return;
  const i0 = gy * CH_CELLS + gx;
  const target = chGrid[i0];
  if (target === chColor) return;
  const st = [i0];
  while (st.length) {
    const c = st.pop();
    if (chGrid[c] !== target) continue;
    chGrid[c] = chColor;
    const x = c % CH_CELLS, y = (c - x) / CH_CELLS;
    if (x > 0) st.push(c - 1);
    if (x < CH_CELLS - 1) st.push(c + 1);
    if (y > 0) st.push(c - CH_CELLS);
    if (y < CH_CELLS - 1) st.push(c + CH_CELLS);
  }
}
/* 删除一顶自制帽子（若正戴着则自动卸下） */
function chDelete(id) {
  customHats = customHats.filter(h => h.id !== id);
  if (equippedCh === id) equippedCh = null;
  delete hatImgs[id];
  delete hatBBox[id];
  chSel = null; chDel = null;
  saveHatData();
}
/* 画板点击/拖动：工具、调色板、画布、取消/确认 */
function chEditDown(p) {
  const g = chEditGeom();
  if (chAskExit) {                       // 取消弹窗：保存并退出 / 不保存 / 继续画
    const A = chAskGeom();
    for (const r of A.rows) {
      if (!inRect(p, r)) continue;
      if (r.key === 'save') trySaveCh();
      else if (r.key === 'nosave') chLeave();
      else chAskExit = false;
      return;
    }
    return;
  }
  if (inRect(p, g.cancel)) { chAskExit = true; return; }
  if (inRect(p, g.ok)) { trySaveCh(); return; }
  for (const t of g.tools) { if (inRect(p, t)) { chTool = t.key; return; } }
  // 调色板（64 色 8×8）
  const P = g.pal;
  if (p.x >= P.x && p.x < P.x + P.cols * (P.s + P.gap) && p.y >= P.y && p.y < P.y + P.rows * (P.s + P.gap)) {
    const col = Math.floor((p.x - P.x) / (P.s + P.gap));
    const row = Math.floor((p.y - P.y) / (P.s + P.gap));
    if (col >= 0 && col < P.cols && row >= 0 && row < P.rows) { chColor = row * P.cols + col; return; }
  }
  // 画板：开始绘制
  const b = g.board;
  if (p.x >= b.x && p.x < b.x + b.w && p.y >= b.y && p.y < b.y + b.h) {
    const gx = Math.floor((p.x - b.x) / b.cell), gy = Math.floor((p.y - b.y) / b.cell);
    if (chTool === 'fill') { chFlood(gx, gy); _chPaint = false; }
    else { _chPaint = true; _chLast = { x: gx, y: gy }; chPaintAt(gx, gy); }
  }
}
function chEditMove(p) {
  if (!_chPaint) return;
  const b = chEditGeom().board;
  if (p.x < b.x || p.x >= b.x + b.w || p.y < b.y || p.y >= b.y + b.h) { _chPaint = false; return; }
  const gx = Math.floor((p.x - b.x) / b.cell), gy = Math.floor((p.y - b.y) / b.cell);
  if (_chLast) chPaintLine(_chLast.x, _chLast.y, gx, gy); else chPaintAt(gx, gy);
  _chLast = { x: gx, y: gy };
}
/* 画板编辑器界面 */
function drawHatEditScreen() {
  ctx.fillStyle = 'rgba(6,11,8,0.97)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  // 标题
  ctx.fillStyle = '#ffd93d';
  ctx.font = 'bold 28px "Courier New", monospace';
  ctx.fillText('自制帽子', W / 2, 44);
  ctx.fillStyle = 'rgba(210,250,225,0.6)';
  ctx.font = '13px "Courier New", monospace';
  ctx.fillText(chMode === 'edit' ? '修改：' + chName(chEditId) : '新建帽子（' + customHats.length + '/' + CH_MAX + '）', W / 2, 76);
  const g = chEditGeom();
  // 工具（画笔 / 橡皮 / 填充）
  for (const t of g.tools) {
    const active = chTool === t.key;
    ctx.fillStyle = active ? 'rgba(255,217,61,0.25)' : 'rgba(40,66,46,0.95)';
    ctx.strokeStyle = active ? '#ffd93d' : 'rgba(150,210,130,0.7)';
    ctx.lineWidth = active ? 3 : 2;
    ctx.beginPath();
    ctx.roundRect(t.x, t.y, t.w, t.h, 8);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = active ? '#ffd93d' : 'rgba(225,245,215,0.9)';
    ctx.font = 'bold 16px "Courier New", monospace';
    ctx.fillText(t.label, t.x + t.w / 2, t.y + t.h / 2);
  }
  // 当前颜色小方块（工具行右侧）
  ctx.font = '12px "Courier New", monospace';
  ctx.fillStyle = 'rgba(200,230,190,0.75)';
  ctx.textAlign = 'right';
  ctx.fillText('颜色', W / 2 - 168, 140);
  ctx.fillStyle = HAT_PAL[chColor];
  ctx.strokeStyle = 'rgba(230,255,235,0.8)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.rect(W / 2 - 162, 126, 26, 26);
  ctx.fill(); ctx.stroke();
  ctx.textAlign = 'center';
  // 画板（棋盘格表示透明）
  const b = g.board;
  ctx.fillStyle = 'rgba(14,22,16,0.9)';
  ctx.strokeStyle = 'rgba(150,220,150,0.9)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.roundRect(b.x - 2, b.y - 2, b.w + 4, b.h + 4, 4);
  ctx.fill(); ctx.stroke();
  for (let y = 0; y < CH_CELLS; y++) {
    for (let x = 0; x < CH_CELLS; x++) {
      const v = chGrid[y * CH_CELLS + x];
      const px = b.x + x * b.cell, py = b.y + y * b.cell;
      if (v == null || v < 0) { // 透明 → 浅棋盘格
        ctx.fillStyle = ((x + y) % 2 === 0) ? 'rgba(38,58,42,0.85)' : 'rgba(50,76,56,0.85)';
        ctx.fillRect(px, py, b.cell, b.cell);
      } else {
        ctx.fillStyle = HAT_PAL[v] || '#000';
        ctx.fillRect(px, py, b.cell, b.cell);
        ctx.fillStyle = 'rgba(0,0,0,0.12)';
        ctx.fillRect(px, py, b.cell, 1);
        ctx.fillRect(px, py, 1, b.cell);
      }
    }
  }
  // 调色板
  const P = g.pal;
  ctx.font = '11px "Courier New", monospace';
  ctx.fillStyle = 'rgba(210,240,220,0.7)';
  ctx.textAlign = 'center';
  ctx.fillText('64 色', P.x + P.cols * (P.s + P.gap) / 2, P.y - 8);
  for (let i = 0; i < HAT_PAL.length; i++) {
    const row = Math.floor(i / P.cols), col = i % P.cols;
    const px = P.x + col * (P.s + P.gap), py = P.y + row * (P.s + P.gap);
    ctx.fillStyle = HAT_PAL[i];
    ctx.fillRect(px, py, P.s, P.s);
    if (i === chColor) {
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.strokeRect(px - 1, py - 1, P.s + 2, P.s + 2);
    }
  }
  // 底部：取消 / 确认
  ctx.font = 'bold 17px "Courier New", monospace';
  ctx.fillStyle = 'rgba(120,40,32,0.95)';
  ctx.strokeStyle = '#ff8a7a';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.roundRect(g.cancel.x, g.cancel.y, g.cancel.w, g.cancel.h, 10);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#ffb3a6';
  ctx.fillText('取 消', g.cancel.x + g.cancel.w / 2, g.cancel.y + g.cancel.h / 2);
  ctx.fillStyle = 'rgba(196,160,20,0.95)';
  ctx.strokeStyle = '#ffd93d';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.roundRect(g.ok.x, g.ok.y, g.ok.w, g.ok.h, 10);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#fff3c0';
  ctx.fillText('确 认', g.ok.x + g.ok.w / 2, g.ok.y + g.ok.h / 2);
  // 提示
  if (chToast && nowMs - chToast.t < 2200) {
    ctx.fillStyle = chToast.color;
    ctx.font = 'bold 16px "Courier New", monospace';
    ctx.fillText(chToast.msg, W / 2, H - 122);
  }
  // 取消确认弹窗
  if (chAskExit) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, H);
    const A = chAskGeom();
    ctx.fillStyle = 'rgba(10,20,13,0.98)';
    ctx.strokeStyle = 'rgba(255,217,61,0.9)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(A.box.x, A.box.y, A.box.w, A.box.h, 12);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ffd93d';
    ctx.font = 'bold 20px "Courier New", monospace';
    ctx.fillText('要保存这顶帽子吗？', W / 2, A.title);
    const labels = { save: '保存并退出', nosave: '不保存直接退出', stay: '继续画' };
    for (const r of A.rows) {
      const isSave = r.key === 'save', isNo = r.key === 'nosave';
      ctx.fillStyle = isSave ? 'rgba(196,160,20,0.95)' : (isNo ? 'rgba(90,40,32,0.95)' : 'rgba(46,92,54,0.95)');
      ctx.strokeStyle = isSave ? '#ffd93d' : (isNo ? '#ff8a7a' : 'rgba(180,250,130,0.9)');
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(r.x, r.y, r.w, r.h, 8);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = isSave ? '#fff3c0' : (isNo ? '#ffb3a6' : '#eaffdc');
      ctx.font = 'bold 17px "Courier New", monospace';
      ctx.fillText(labels[r.key], r.x + r.w / 2, r.y + r.h / 2);
    }
  }
}
/* 画板指针输入（统一鼠标 / 触摸） */
canvas.addEventListener('pointerdown', (e) => {
  if (state !== 'hatEdit') return;
  e.preventDefault();
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  chEditDown(chEvtXY(e));
});
canvas.addEventListener('pointermove', (e) => {
  if (state !== 'hatEdit' || !_chPaint) return;
  chEditMove(chEvtXY(e));
});
canvas.addEventListener('pointerup', () => { _chPaint = false; _chLast = null; });
canvas.addEventListener('pointercancel', () => { _chPaint = false; _chLast = null; });

/* ============ 输入处理 ============ */
/* 清空输入残留：进出设置界面时调用，避免恢复后蛇自己乱动 */
function clearInputState() {
  heldDir = null;
  pendingMove = null;
  tapCd = TAP_INTERVAL;
  holdCd = HOLD_INTERVAL;
}

window.addEventListener('keydown', (e) => {
  const k = e.key;
  // —— 画板编辑器：ESC = 取消（再按一次关闭"是否保存"弹窗）——
  if (state === 'hatEdit') {
    if (k === 'Escape' || k === 'Esc') {
      chAskExit = !chAskExit;                 // 已弹窗时 ESC 回到继续画
      e.preventDefault();
    }
    return;
  }
  // —— 隐藏作弊：主菜单快速连按 a-d-a-d，获得 1 万苹果并解锁全部装饰（不显示任何提示）——
  if (state === 'ready') {
    const low = k.toLowerCase();
    if (low === 'a' || low === 'd') {
      const now = performance.now();
      if (now - cheatLast > 1200) cheatSeq = '';
      cheatSeq += low;
      cheatLast = now;
      if (cheatSeq.endsWith('adad')) {
        cheatSeq = '';
        appleBank += 10000;
        ownedHats = HAT_IDS.slice();
        ownedSkins = SKIN_IDS.slice();
        ownedScenes = SCENE_IDS.slice();
        saveHatData();
      } else if (cheatSeq.length > 6) {
        cheatSeq = cheatSeq.slice(-6);   // 只保留最近 6 个字符，够用即可
      }
    }
  }
  // —— 装饰界面：B / 空格 / ESC / 回车 返回主菜单；数字 1/2/3 装备当前标签第 1/2/3 件 ——
  if (state === 'hats') {
    const chMenuOpen = chSel != null || chDel != null;
    if (chMenuOpen && (k === 'Escape' || k === 'Esc')) {   // 先关选项菜单/删除确认
      chSel = null; chDel = null;
      e.preventDefault();
      return;
    }
    if (k === 'b' || k === 'B' || k === ' ' || k === 'Escape' || k === 'Esc' || k === 'Enter') {
      chSel = null; chDel = null;
      state = 'ready';
    } else if (k === '1' || k === '2' || k === '3') {
      const list = ownedOf(decorTab);
      const idx = parseInt(k, 10) - 1;
      if (idx < list.length && list[idx]) {
        setEquipped({ id: list[idx], cat: decorTab });
        saveHatData();
      }
    }
    e.preventDefault();
    return;
  }
  // —— 设置界面（游戏已暂停）：按 空格（或回车/ESC）关闭并返回来源（主菜单或对局） ——
  if (state === 'settings') {
    if (resetAsk) {                    // 重置确认弹窗优先：ESC 只取消弹窗
      if (k === 'Escape' || k === 'Esc') resetAsk = false;
      e.preventDefault();
      return;
    }
    if (k === ' ' || k === 'Enter' || k === 'Escape' || k === 'Esc') {
      closeSettings();
    }
    e.preventDefault();
    return;
  }
  // —— 主菜单：按 B 进入帽子界面 ——
  if (state === 'ready' && (k === 'b' || k === 'B')) {
    hatPrompt = null;
    state = 'hats';
    e.preventDefault();
    return;
  }
  // —— 主菜单：按 ESC 打开设置界面 ——
  if (state === 'ready' && (k === 'Escape' || k === 'Esc')) {
    settingsFrom = 'ready';
    resetAsk = false;
    state = 'settings';
    e.preventDefault();
    return;
  }
  // —— 游戏中的方向操作 ——
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') {
    if (state === 'playing' && !e.repeat) {   // 只认第一次按下；自动重复忽略
      heldDir = [-1, 0];
      holdCd = 0;                 // 长按计时从按下开始
      pendingMove = [-1, 0];      // 待走方向（走格节奏由点按/长按冷却决定）
    }
    e.preventDefault();
  } else if (k === 'ArrowRight' || k === 'd' || k === 'D') {
    if (state === 'playing' && !e.repeat) {
      heldDir = [1, 0];
      holdCd = 0;
      pendingMove = [1, 0];
    }
    e.preventDefault();
  } else if (k === 'ArrowUp' || k === 'w' || k === 'W') {
    if (state === 'playing' && !e.repeat) {   // 向上走一格（蛇身会垫到脚下）
      heldDir = [0, -1];
      holdCd = 0;
      pendingMove = [0, -1];
    }
    e.preventDefault();
  } else if (k === ' ') {
    e.preventDefault();
    if (state === 'ready' && !tutorOn()) { clearInputState(); startGame(); }   // 引导中不可开始
    // 死亡后空格 → 回到主菜单（再按一次空格才开始新一局），同时重启 AI 背景演示
    else if (state === 'dead' && nowMs - deathAt > 350) { goReady(); }
  } else if (k === 'Escape' || k === 'Esc') {
    if (state === 'playing') {    // 打开设置并暂停
      clearInputState();
      settingsFrom = 'playing';
      resetAsk = false;
      state = 'settings';
    }
    e.preventDefault();
  }
});
/* ============ 鼠标点击：主菜单装饰按钮 / 装饰界面标签·卡片·抽奖 ============ */
canvas.addEventListener('click', (e) => {
  if (Date.now() - chLeftTs < 300) return;   // 刚从画板返回：吞掉同一次点击的残留 click，避免误触底部按钮
  const rect = canvas.getBoundingClientRect();
  const px = (e.clientX - rect.left) * (W / rect.width);
  const py = (e.clientY - rect.top) * (H / rect.height);
  const p = { x: px, y: py };
  if (state === 'ready') {
    // 右下角"装饰"按钮
    const R = menuBtnHat();
    if (inRect(p, R)) {
      hatPrompt = null;
      state = 'hats';
      return;
    }
    // 左下角"设置"按钮
    const S = menuBtnSettings();
    if (inRect(p, S)) {
      settingsFrom = 'ready';
      resetAsk = false;
      state = 'settings';
      return;
    }
  } else if (state === 'settings') {
    // 重置确认弹窗优先
    if (resetAsk) {
      const C = confirmLayout();
      if (inRect(p, C.yes)) { resetAllData(); resetAsk = false; return; }
      if (inRect(p, C.no)) { resetAsk = false; return; }
      return;
    }
    // 普通设置项（与绘制共用同一组坐标）
    const geo = settingsGeometry();
    for (const it of geo.items) {
      if (!inRect(p, it)) continue;
      if (it.key === 'sound') { setSound(!soundOn); return; }
      if (it.key === 'scan') { setScanline(!scanlineOn); return; }
      if (it.key === 'back') {
        clearInputState();
        resetAsk = false;
        state = settingsFrom === 'playing' ? 'playing' : 'ready';
        return;
      }
      if (it.key === 'giveup') { abandonGame(); return; }
    }
    // 重置游戏数据（固定在底部）
    if (inRect(p, geo.reset)) { resetAsk = true; return; }
  } else if (state === 'hats') {
    const { tabs, cards, drawBtn } = decorGeometry();
    // —— 自制帽子：删除确认面板（最上层）——
    if (chDel != null) {
      const C = chDelLayout();
      if (inRect(p, C.yes)) chDelete(chDel);
      else if (inRect(p, C.no)) chDel = null;
      return;
    }
    // —— 自制帽子：选项菜单（穿戴 / 修改 / 删除 / 取消）——
    if (chSel != null) {
      const g = chOptLayout();
      for (const r of g.rows) {
        if (!inRect(p, r)) continue;
        if (r.key === 'wear') {
          if (equippedCh === chSel) { equippedCh = null; saveHatData(); }   // 正穿着 → 再点即卸下
          else wearCh(chSel);
          chSel = null;
        } else if (r.key === 'edit') { openChEditor('edit', chSel, 'hats'); }
        else if (r.key === 'del') { chDel = chSel; }
        else chSel = null;
        return;
      }
      return;
    }
    // 移动端：左上角"返回"按钮 → 回主菜单
    if (isTouch) {
      const B = hatBackBtn();
      if (inRect(p, B)) { goReady(); return; }
    }
    // 底部按钮：自制帽子页＝＋新建；其它＝抽奖（只有真抽到才完成新手引导）
    if (inRect(p, drawBtn)) {
      if (decorTab === 'ch') { openChEditor('new', null, 'hats'); return; }
      if (doHatDraw()) completeTutor();   // 抽到装饰 → 引导完成；抽空/苹果不足则保留引导
      return;
    }
    // 标签 → 切换类别
    for (const t of tabs) {
      if (p.x >= t.x && p.x <= t.x + t.w && p.y >= 104 && p.y <= 136) { decorTab = t.key; chSel = null; chDel = null; return; }
    }
    // 卡片：自制帽子页点开选项菜单；其它类别点击即装备
    for (const c of cards) {
      if (!inRect(p, c)) continue;
      if (decorTab === 'ch') { chSel = c.id; return; }
      if (ownedOf(decorTab).indexOf(c.id) >= 0) {
        setEquipped({ id: c.id, cat: decorTab });
        saveHatData();
      }
      return;
    }
  }
});
/* 松开方向键 → 停止长按移动 */
window.addEventListener('keyup', (e) => {
  const k = e.key;
  if ((k === 'ArrowLeft' || k === 'a' || k === 'A') && heldDir && heldDir[0] === -1) heldDir = null;
  else if ((k === 'ArrowRight' || k === 'd' || k === 'D') && heldDir && heldDir[0] === 1) heldDir = null;
  else if ((k === 'ArrowUp' || k === 'w' || k === 'W') && heldDir && heldDir[1] === -1) heldDir = null;
});

/* ============ 移动端支持 ============
 * 暂停按钮：对局/暂停中显示，点按切换（桌面端用 ESC）
 * 触控滑动：对局中全屏滑动——左右滑移动方向、上滑爬一格、下滑无效；其余界面点按走原生 click
 */
const pauseBtn = document.getElementById('pauseBtn');
function updatePauseBtn() {
  const show = isTouch && (state === 'playing' || state === 'settings');
  pauseBtn.classList.toggle('hidden', !show);
}
pauseBtn.addEventListener('click', (ev) => {
  ev.stopPropagation();
  if (state === 'playing') { clearInputState(); settingsFrom = 'playing'; resetAsk = false; state = 'settings'; }
  else if (state === 'settings') {
    clearInputState();
    resetAsk = false;
    // 从主菜单打开设置时该"返回"应回主菜单，而不是直接开一局
    state = settingsFrom === 'playing' ? 'playing' : 'ready';
  }
});

let _ts = null;   // 触控起点
window.addEventListener('touchstart', (e) => {
  const t = e.changedTouches[0];
  _ts = { x: t.clientX, y: t.clientY };
}, { passive: true });

window.addEventListener('touchend', (e) => {
  if (!_ts) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - _ts.x, dy = t.clientY - _ts.y;
  const dist = Math.hypot(dx, dy);
  _ts = null;

  if (state !== 'playing') {
    // 点按（非滑动）：交由原生 click 处理菜单/装饰；这里只补主菜单开始与结算返回
    if (dist < 20) {
      const rect = canvas.getBoundingClientRect();
      const px = (t.clientX - rect.left) * (W / rect.width);
      const py = (t.clientY - rect.top) * (H / rect.height);
      if (state === 'ready' && px >= 0 && px <= W && py >= 0 && py <= H) {
        const R = menuBtnHat(), S = menuBtnSettings();
        const onBtn = inRect({ x: px, y: py }, R) || inRect({ x: px, y: py }, S);
        if (!onBtn && !tutorOn()) { clearInputState(); startGame(); }   // 引导中不可开始
      } else if (state === 'dead' && nowMs - deathAt > 350) {
        goReady();
      }
    }
    return;
  }

  // 对局中：识别为滑动才移动；点按不做事（避免误触）
  if (dist < 20) return;
  const adx = Math.abs(dx), ady = Math.abs(dy);
  if (adx > ady) {
    pendingMove = [dx > 0 ? 1 : -1, 0];      // 左右滑动
  } else if (dy < 0) {
    pendingMove = [0, -1];                    // 上滑爬一格
  }
}, { passive: true });

/* ============ 主循环（requestAnimationFrame 60fps） ============ */
let lastTime = 0;
function loop(t) {
  requestAnimationFrame(loop);
  nowMs = t;
  ensureTutorLatch();
  let dt = (t - lastTime) / 1000;
  lastTime = t;
  if (dt > 1 / 30) dt = 1 / 30;
  if (dt > 0) update(dt);
  draw();
  updatePauseBtn();
}

/* 初始化并启动主菜单背景自动演示 */
startDemo();
requestAnimationFrame(loop);
</script>
</body>
